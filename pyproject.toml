[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cn3s"
version = "0.1.0"
description = "CN3S rainfall-runoff model (Curve Number with Three-Step Antecedent Precipitation)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
reports = ["python-docx>=1.2,<2"]
web = [
    "flask",
    "gunicorn",
    "flask-session>=0.8,<1",
    "cachelib>=0.13,<1",
    "pandas",
    "matplotlib",
    "tqdm",
    "geopandas",
    "sqlalchemy",
    "pyodbc",
    "azure-identity",
    "msal>=1.23,<2",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "plotly>=6,<8",
    "xarray",
    "rioxarray",
    "netCDF4",
    "merge-downloader @ https://codeload.github.com/cordmaur/merge-downloader/tar.gz/5660c84f76da244fb057d0f188a76158ecc14013#sha256=19acd5f6a37e516c7ed6f3dce92508a4bc1a659ea8417aa6e1c38273580cf5ae",
]
dev = [
    "mypy",
    "ruff",
    "pytest",
    "numpy-stubs",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cn3s"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# TRY003 permits clear built-in exceptions without custom classes; COM812 conflicts with ruff format.
ignore = ["C901", "ANN401", "RET504", "EXE002", "T201", "D203", "D212", "TRY300", "BLE001", "S608", "S101", "PLR0913", "S301", "TRY003", "COM812", "B019"]

[tool.mypy]
files = [
    "src/cn3s"
]
strict = true
local_partial_types = true
strict_equality_for_none = true
warn_unreachable = true
follow_imports = "skip"
ignore_missing_imports = true

# Preserve framework types when checking the Flask entry points explicitly.
[[tool.mypy.overrides]]
module = ["flask.*", "werkzeug.*"]
follow_imports = "normal"
