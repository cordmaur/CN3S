<dialog class="progress-dialog" aria-labelledby="progress-title">
  <header class="dialog-head">
    <h2 id="progress-title"></h2>
    <button type="button" class="quiet" data-progress-close>Fechar</button>
  </header>
  <progress max="100" aria-label="Etapas concluídas"></progress>
  <div class="progress-messages" role="log" tabindex="0" aria-label="Andamento da tarefa"></div>
</dialog>
