<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>SHC — Sistema Hidrológico da COVEC</title>
<link rel="stylesheet" href="{{ url_for('static', filename='shc.css') }}">

<script defer src="{{ url_for('static', filename='shc.js') }}">
</script>
</head>
<body>{% if user %}
<header class="app-header">
<div class="header-inner">
<div aria-hidden="true" class="logo">SHC</div>
<div class="brand">
<strong>SHC</strong>
<div>Sistema Hidrológico da COVEC</div>
</div>
<div class="identity">{{ user }}<span>Conta institucional Microsoft</span>
</div>
<form action="{{ url_for('login.logout') }}" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<button class="quiet" type="submit">Sair</button>
</form>
</div>
<nav aria-label="Módulos da SHC" class="tabs">
<a class="{{ 'active' if active == 'home' else '' }}" href="{{ url_for('home') }}">Início</a>
<a class="{{ 'active' if active == 'permanencia' else '' }}" href="{{ url_for('permanencia.index') }}">Curvas de Permanência</a>
<a aria-disabled="true" tabindex="-1">Chuvas <small>Em breve</small>
</a>
<a aria-disabled="true" tabindex="-1">CN3S <small>Em breve</small>
</a>
</nav>
</header>
{% endif %}{% block content %}{% endblock %}
<div id="toast" role="status" hidden>
</div>
</body>
</html>
