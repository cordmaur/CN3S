<div id="cn-details" hidden>
  <div class="cn-station-grid">
    <section class="card"><h2 id="cn-name"></h2><dl id="cn-fields"></dl>
      <details id="cn-inventory" hidden><summary>Inventário completo</summary><dl id="cn-inventory-fields"></dl></details>
    </section>
    <figure class="card cn-map">
      <h2>Bacia contribuinte</h2><div id="cn-map"></div><p class="muted" id="cn-map-note" role="status"></p>
      <figcaption><span class="cn-swatch"></span> Bacia <span id="cn-marker"><i></i> Estação</span> · Limites estaduais do IBGE, 2022</figcaption>
    </figure>
  </div>
  <section class="card">
    <h2>Séries hidrológicas</h2><p class="muted" id="cn-status" role="status"></p>
    <button type="button" id="cn-refresh">Atualizar estatísticas</button>
    <progress id="cn-series-progress" aria-label="Atualizando séries hidrológicas" hidden></progress>
    <div class="cn-actions" aria-label="Variável hidrológica">
      <button type="button" data-series="cota" aria-pressed="true">Cota (cm)</button>
      <button type="button" data-series="vazao" aria-pressed="false">Vazão (m³/s)</button>
    </div>
    <div id="cn-stats" class="cn-table-wrap"></div>
    <p class="muted">Cobertura diária por fonte. Anos efetivos descontam as falhas. Consistência é a proporção de registros consolidados no Hidro.</p>
  </section>
</div>
<dialog id="cn-dialog" aria-labelledby="cn-dialog-title">
  <h2 id="cn-dialog-title">Adicionar estação</h2>
  <p>A criação prepara a bacia e consulta as séries de cota e vazão.</p>
  <form id="cn-form">
    <label for="cn-code">Código ANA</label><input id="cn-code" inputmode="numeric" pattern="[1-9][0-9]*" required autofocus>
    <p id="cn-phase" role="status"></p><progress id="cn-bar" max="4" value="0" aria-label="Etapas concluídas" hidden></progress>
    <p id="cn-dialog-error" role="alert"></p>
    <div class="dialog-actions"><button type="button" class="quiet" id="cn-cancel">Cancelar</button><button id="cn-prepare">Adicionar</button></div>
  </form>
</dialog>
